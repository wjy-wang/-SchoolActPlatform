version: '3.8'

services:
  # mysql:
  #   image: mysql:8.0
  #   container_name: mysql-school-activity
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  #     MYSQL_DATABASE: ${MYSQL_DATABASE}
  #     MYSQL_USER: ${MYSQL_USER}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  #   ports:
  #     - "3307:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   restart: always

  redis:
    image: redis:7.0-alpine
    container_name: redis-school-activity
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-school-activity
    volumes:
      - frontend_dist:/dist
    restart: "no"

  nginx:
    image: nginx:latest
    container_name: nginx-school-activity
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - frontend_dist:/usr/share/nginx/html
      - ./backend/staticfiles:/usr/share/nginx/html/static
    restart: always
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-school-activity
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app 
      - ./ca.pem:/app/ca.pem
    depends_on:
      # - mysql
      - redis
    entrypoint: ""                      # <-- 新增：清空镜像自带的 ENTRYPOINT
    command: ["gunicorn", "school_activity.wsgi:application", "--bind", "0.0.0.0:8000"]   # <-- 新增：直接运行 gunicorn
    environment:
      # - DATABASE_URL=mysql://school_activity_user:school_activity_pass@mysql:3306/school_activity  # 已注释，改用云数据库
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=your-secret-key-here
    restart: always

volumes:
  # mysql_data:
  frontend_dist:
  redis_data:
